plugins {
    id 'com.android.application'
}

def ocpVersionName = System.getenv("OCP_VERSION") ?: "1.0.4"
def ocpVersionCode = 41
def vcodeEnv = System.getenv("OCP_VERSION_CODE")
if (vcodeEnv != null && vcodeEnv ==~ /[0-9]+/) {
    ocpVersionCode = vcodeEnv.toInteger()
}
def ocpUpdateUrl = System.getenv("OCP_UPDATE_URL") ?: ""
def escapeBuildConfig = { String s ->
    s.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace "net.openconnect_vpn.android"
    defaultConfig {
        applicationId "net.openconnect_plus_p.android"
        minSdk 23
        targetSdk 34
        compileSdk 35

        versionCode ocpVersionCode
        versionName ocpVersionName
        buildConfigField "String", "BUILT_IN_UPDATE_URL", "\"${escapeBuildConfig(ocpUpdateUrl)}\""
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    if (file("release.properties").exists()) {
        signingConfigs {
            release {
                file("release.properties").with {
                    def properties = new Properties()
                    properties.load(new FileInputStream(it))

                    storeFile file(properties['path'])
                    keyAlias properties['alias']
                    storePassword properties['password']
                    keyPassword properties['password']
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (file("release.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    lintOptions {
        disable 'ExtraTranslation'
        disable 'IconColors'
        disable 'InconsistentArrays'
        disable 'MissingTranslation'
        disable 'OldTargetApi'
        disable 'SuspiciousIndentation'

        // It's a tremendous amount of work to get rid of all references to `Context` in the app
        disable 'StaticFieldLeak'

        baseline file("lint-baseline.xml")
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java {
                srcDirs += [
                        '../external/openconnect/java/src',
                        '../external/stoken/java/src'
                ]
                exclude 'com/example/**'
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
