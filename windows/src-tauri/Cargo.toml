[package]
name = "myoc_windows"
version = "1.0.3"
description = "OpenConnect +P Windows client (Tauri + libopenconnect)"
authors = ["MyOCApp contributors"]
edition = "2021"

[lib]
name = "myoc_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Kept for compatibility; real VPN uses runtime DLL load (no link feature required).
libopenconnect = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libloading = "0.8"
socket2 = "0.5"
ureq = { version = "2.12", features = ["json", "tls"] }
native-tls = "0.2"
base64 = "0.22"
tauri-plugin-single-instance = "2"
